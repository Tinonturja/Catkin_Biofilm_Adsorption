[project]
name = "catkin-biofilm-adsorption"
version = "0.1.0"
description = "Kinetic, isotherm, and physics-informed neural network (PINN3D) modeling of reactive dye adsorption on a Saccharum spontaneum (Catkin) flower-fibre CMC/PVA/TiO2 biofilm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tinon Turja Majumder" },
]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "torch==2.6.0",
    "openpyxl==3.1.5",
]

[project.urls]
Repository = "https://github.com/Tinonturja/Catkin_Biofilm_Adsorption"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
